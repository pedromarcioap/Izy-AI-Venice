<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Izy AI Venice - Web App</title>
  <link rel="stylesheet" href="web-styles.css">
  <script src="security.js"></script>
  <script src="models.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>🤖 Izy AI Venice</h1>
      <button id="settings-btn" class="settings-btn">⚙️</button>
    </div>

    <div id="main-view">
        <button type="button" id="clear-cache" class="clear-cache-btn">🗑️</button>
      <div id="chat-container">
        <div id="messages"></div>
        <div class="input-container">
          <input type="text" id="user-input" placeholder="Digite sua mensagem aqui..." maxlength="1000">
          <button id="send-btn">📤</button>
        </div>
      </div>
      <div id="models-stats" class="models-stats"></div>
    </div>

    <div id="settings-view" class="hidden">
      <div class="settings-header">
        <button id="back-btn">← Voltar</button>
        <h2>Configurações</h2>
      </div>
      
      <div class="setting-group">
        <label for="api-key">OpenRouter API Key:</label>
        <input type="password" id="api-key" placeholder="Insira sua API key">
        <div id="key-status"></div>
        <button type="button" id="validate-key" class="validate-btn">Validar Chave</button>
        <small>Obtenha sua chave em <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a></small>
      </div>

      <div class="setting-group">
        <label for="model-select">Modelo:</label>
        <div class="model-controls">
          <input type="text" id="model-search" placeholder="Buscar modelos..." class="model-search">
          <button type="button" id="refresh-models" class="refresh-btn">🔄</button>
        </div>
        <select id="model-select">
          <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
        </select>
        <div id="models-loading" style="display: none;">
          <small>Carregando modelos...</small>
        </div>
      </div>

      <button id="save-settings">Salvar Configurações</button>
      <button id="clear-chat">Limpar Chat</button>
    </div>
  </div>

  <script src="web-app.js"></script>
</body>
</html>
